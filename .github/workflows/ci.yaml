
name: DeployForge CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Run Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run automated tests
        run: python -m pytest -v
  build:
    name: Build Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag deployforge:${{ github.sha }} .

      - name: Verify Docker image
        run: docker image inspect deployforge:${{ github.sha }}
      - name: Run Docker container
        run: |
          docker run -d \
            --name deployforge-test \
            --publish 127.0.0.1:8000:8000 \
            deployforge:${{ github.sha }}

      - name: Verify container health
        run: |
          for i in {1..30}; do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' deployforge-test)
            echo "Container health: $STATUS"

            if [ "$STATUS" = "healthy" ]; then
              exit 0
            fi

            sleep 2
          done

          docker logs deployforge-test
          exit 1

      - name: Test application endpoints
        run: |
          curl --fail http://127.0.0.1:8000/
          curl --fail http://127.0.0.1:8000/health

      - name: Stop test container
        if: always()
        run: docker rm -f deployforge-test || true
